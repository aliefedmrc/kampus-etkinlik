<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kampüs Etkinlikleri — Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/2416501079.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>

  <header>
    <h1>Etkinlik Ekle</h1>
  </header>

  <nav aria-label="Ana menü">
  <a href="index.html">Ana Sayfa</a>
  <a href="etkinlikler.html">Etkinlikler</a>
  <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
  
</nav>

  <main>
  <p>
    Yıldızlı (*) alanlar zorunludur.
    Bu sprintte bilgiler kalıcı olarak kaydedilmez.
  </p>

  <form
    id="etkinlik-formu"
    class="etkinlik-formu"
    data-mode="ekle"
    novalidate>

    <p>
      <label for="ad">Etkinlik Adı *</label>
      <input
        type="text"
        id="ad"
        name="ad"
        maxlength="80"
        placeholder="Örn. Kariyer Günleri 2026"
        aria-describedby="ad-hata"
        required>
      <span id="ad-hata" class="alan-hata"></span>
    </p>

    <p>
      <label for="kategori">Kategori *</label>
      <select
        id="kategori"
        name="kategori"
        aria-describedby="kategori-hata"
        required>
        <option value="">Seçiniz</option>
        <option value="Seminer">Seminer</option>
        <option value="Atölye">Atölye</option>
        <option value="Söyleşi">Söyleşi</option>
        <option value="Yarışma">Yarışma</option>
      </select>
      <span id="kategori-hata" class="alan-hata"></span>
    </p>

    <p>
      <label for="tarih">Tarih *</label>
      <input
        type="date"
        id="tarih"
        name="tarih"
        aria-describedby="tarih-hata"
        required>
      <span id="tarih-hata" class="alan-hata"></span>
    </p>

    <p>
      <label for="saat">Saat *</label>
      <input
        type="time"
        id="saat"
        name="saat"
        aria-describedby="saat-hata"
        required>
      <span id="saat-hata" class="alan-hata"></span>
    </p>

    <p>
      <label for="yer">Yer *</label>
      <input
        type="text"
        id="yer"
        name="yer"
        maxlength="80"
        placeholder="Örn. A Blok Konferans Salonu"
        aria-describedby="yer-hata"
        required>
      <span id="yer-hata" class="alan-hata"></span>
    </p>

    <p>
      <label for="kontenjan">Kontenjan</label>
      <input
        type="number"
        id="kontenjan"
        name="kontenjan"
        min="1"
        max="1000"
        aria-describedby="kontenjan-hata">
      <span id="kontenjan-hata" class="alan-hata"></span>
    </p>

    <p>
      <label for="aciklama">Açıklama</label>
      <textarea
        id="aciklama"
        name="aciklama"
        rows="5"
        aria-describedby="aciklama-hata"></textarea>
      <span id="aciklama-hata" class="alan-hata"></span>
    </p>

    <p>
      <button type="submit">Kaydet</button>
      <button type="reset">Temizle</button>
    </p>
  </form>

  <div id="form-mesaj" aria-live="polite"></div>
</main>

  <footer>
    <p>AliEfe Demirci &middot; 2416501079 &middot; 2026</p>
  </footer>

</body>
</html>
