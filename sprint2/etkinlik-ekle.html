<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kampüs Etkinlikleri — Etkinlik Ekle</title>
  <link rel="stylesheet" href="css/2416501079.css">
</head>
<body>

  <header>
    <h1>Etkinlik Ekle</h1>
  </header>

  <nav aria-label="Ana menü">
  <a href="index.html">Ana Sayfa</a>
  <a href="etkinlikler.html">Etkinlikler</a>
  <a href="etkinlik-ekle.html">Etkinlik Ekle</a>
  <a href="etkinlik-guncelle.html">Etkinlik Güncelle</a>
</nav>

  <main>
    <p>Yıldızlı (*) alanlar zorunludur. Bu sprintte form veri kaydetmez.</p>

    <form class="etkinlik-formu" action="etkinlikler.html" method="get">
      <p>
        <label for="ad">Etkinlik Adı *</label><br>
        <input type="text" id="ad" name="ad" maxlength="80" placeholder="Örn. Kariyer Günleri 2026" required>
      </p>

      <p>
        <label for="kategori">Kategori *</label><br>
        <select id="kategori" name="kategori" required>
          <option value="">Seçiniz</option>
          <option value="seminer">Seminer</option>
          <option value="atolye">Atölye</option>
          <option value="soylesi">Söyleşi</option>
          <option value="yarisma">Yarışma</option>
        </select>
      </p>

      <p>
        <label for="tarih">Tarih *</label><br>
        <input type="date" id="tarih" name="tarih" required>
      </p>

      <p>
        <label for="saat">Saat *</label><br>
        <input type="time" id="saat" name="saat" required>
      </p>

      <p>
        <label for="yer">Yer *</label><br>
        <input type="text" id="yer" name="yer" maxlength="80" placeholder="Örn. A Blok Konferans Salonu" required>
      </p>

      <p>
        <label for="kontenjan">Kontenjan</label><br>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000">
      </p>

      <p>
        <label for="aciklama">Açıklama</label><br>
        <textarea id="aciklama" name="aciklama" rows="5" cols="40"></textarea>
      </p>

      <p>
        <button type="submit">Kaydet</button>
        <button type="reset">Temizle</button>
      </p>
    </form>
  </main>

  <footer>
    <p>AliEfe Demirci &middot; 2416501079 &middot; 2026</p>
  </footer>

</body>
</html>
