<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kampüs Etkinlikleri — Etkinlik Listesi</title>
  <link rel="stylesheet" href="css/2416501079.css">

<body>

  <header>
    <h1>Kampüs Etkinlikleri</h1>
  </header>

  <nav aria-label="Ana menü">
  <a href="index.html">Ana Sayfa</a>
  <a href="etkinlikler.html">Etkinlikler</a>
  <a href="etkinlik-ekle.html">Etkinlik Ekle</a>

</nav>
  <main>
      <h2>Tüm Etkinlikler</h2>

      <form id="filtre-formu" class="filtre">
  <div>
    <label for="arama">Etkinlik ara:</label>
    <input
      type="search"
      id="arama"
      name="arama"
      placeholder="Etkinlik adı veya açıklama">
  </div>

  <div>
    <label for="kategori-filtre">Kategori:</label>
    <select id="kategori-filtre" name="kategori">
      <option value="">Tümü</option>
    </select>
  </div>
</form>

<p id="sonuc" aria-live="polite"></p>

  <section
  id="etkinlik-listesi"
  class="etkinlik-kartlari tum-etkinlikler"
  aria-label="Ekim ayı etkinlikleri">
</section>
  </main>

  <footer>
    <p>AliEfe Demirci &middot; 2416501079 &middot; 2026</p>
  </footer>

</html>
